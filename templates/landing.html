<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PetClinic | Home</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; font-family:'Poppins', sans-serif; }
body { margin:0; background: linear-gradient(135deg, #e3f0ff 0%, #f1e3ff 100%); }
.navbar {
    display:flex; justify-content:space-between; align-items:center; padding:18px 40px; background:#007bff; color:white;
}
.navbar a { text-decoration:none; color:white; font-weight:600; margin-left:15px; }
.navbar .btn { padding:8px 20px; border-radius:20px; border:none; cursor:pointer; font-weight:600; transition:.2s; }
.navbar .btn-outline-light { background:transparent; border:1px solid white; color:white; }
.navbar .btn-outline-light:hover { background:white; color:#007bff; }
.navbar .btn-light:hover { opacity:.85; }
.hero { text-align:center; margin-top:100px; color:#1b2a47; }
.hero h1 { font-size:3rem; color:#007bff; margin-bottom:20px; }
.hero p { font-size:1.2rem; margin-bottom:30px; }
.hero a { background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%); color:white; padding:12px 36px; border-radius:20px; font-weight:600; text-decoration:none; transition:.2s; }
.hero a:hover { background: linear-gradient(90deg, #35c277 0%, #24d1cc 100%); }
@media(max-width:600px){ .hero h1{font-size:2rem;} .hero p{font-size:1rem;} }
</style>
</head>
<body>
<nav class="navbar">
    <div class="brand">🐾 PetClinic</div>
    <div>
        <a href="{{ url_for('login') }}" class="btn btn-outline-light">Login</a>
        <a href="{{ url_for('register') }}" class="btn btn-light">Register</a>
    </div>
</nav>

<div class="hero">
    <h1>Give Your Pet the Best Care</h1>
    <p>Book vet appointments easily with PetClinic.</p>
    <a href="{{ url_for('book') }}">Book Appointment</a>
</div>
</body>
</html>
