<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PetClinic | Admin Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
      :root{
        --primary:#4A7DFF;
        --accent:#ef764c;
        --bg:#f5ede7;
        --muted:#64707a;
      }

      html,body { margin:0; padding:0; font-family:'Quicksand',Arial,sans-serif; background: var(--bg); color: #1b2a47; }
      .navbar { display:flex; align-items:center; justify-content:space-between; max-width:1200px; margin:0 auto; padding:28px 24px 0 24px;}
      .navbar-logo { font-family: 'Montserrat', sans-serif; font-weight:bold; font-size:2rem; color: var(--accent); letter-spacing:.7px;}
      .navbar-buttons { display:flex; gap:1.2rem; }

      .btn-main, .btn-alt, .btn-book { padding:0.72rem 1.8rem; border-radius:50px; font-weight:600; font-size:1.02rem; border:none; text-decoration:none; transition:background 0.18s, color 0.18s, box-shadow 0.16s, transform 0.16s; box-shadow:0 2px 10px rgba(239,118,76,0.07); cursor:pointer; }
      .btn-main { background: linear-gradient(90deg,#4A7DFF 60%, #ef764c 140%); color:#fff; }
      .btn-main:hover { background: var(--accent); }
      .btn-alt { background:#fff; color:var(--primary); border:2px solid var(--primary); }
      .btn-alt:hover { background:var(--primary); color:#fff; }
      .btn-book { background: linear-gradient(90deg, var(--accent) 70%, var(--primary) 100%); color:#fff; }
      .btn-book:hover { background: var(--primary); }

      body { min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; position: relative; padding:24px; }

      /* Main container - fixed name and layout */
      .container {
        max-width:960px;
        width:100%;
        background:white;
        border-radius:20px;
        box-shadow:0 6px 24px rgba(25,75,115,0.10);
        display:flex;
        overflow:hidden;
        margin: 28px 0;
      }

      /* left form + right illustration */
      .box1, .box2 { flex:1; padding:40px; min-width:0; } /* min-width:0 prevents flex overflow on small screens */
      .box1 { display:flex; flex-direction:column; justify-content:center; gap:8px; }
      .box1 h1 { color:var(--primary); margin:0 0 10px 0; font-size:2.1rem; font-family:'Montserrat',sans-serif; }
      .box1 .welcome { color:var(--accent); font-size:1.05rem; margin-bottom:10px; font-family:'Quicksand',sans-serif; }

      /* Brand row on top of form */
      .brand-row { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
      .brand .logo {
        width:56px; height:56px; border-radius:12px; background: linear-gradient(135deg,#dff3ff,#bfe7ff);
        display:flex; align-items:center; justify-content:center; color:var(--primary); font-weight:700; font-size:20px; border:1px solid rgba(11,118,209,0.06);
      }
      .brand .title { font-weight:700; color:var(--primary); font-size:1.05rem; }
      .brand .subtitle { font-size:.9rem; color:var(--muted); margin-top:4px; }

      form { display:flex; flex-direction:column; gap:12px; margin-top:6px; }
      label { display:block; font-weight:600; margin-bottom:6px; color:#273544; }
      input[type=text], input[type=password], input[type=email] {
        width:100%; padding:12px 16px; border:1px solid #e1e4e8; border-radius:8px; font-size:1.05rem; box-sizing:border-box;
        background:#fff;
      }
      input:focus { outline:none; box-shadow:0 6px 18px rgba(74,125,255,0.06); border-color: rgba(74,125,255,0.25); }

      input[type=submit] {
        margin-top:8px;
        padding:13px 36px; border-radius:24px; border:none;
        background: linear-gradient(90deg, var(--accent) 0%, var(--primary) 100%);
        color:white; font-weight:700; cursor:pointer; font-size:1.07rem; font-family: 'Montserrat',sans-serif;
        box-shadow:0 2px 16px rgba(74,125,255,0.08);
        align-self:flex-start;
      }
      input[type=submit]:hover { transform:scale(1.03); }

      .link { margin-top:12px; font-size:.99rem; color:var(--muted); }
      .link a { color:var(--accent); text-decoration:none; font-weight:700; }

      /* Right illustration */
      .box2 { background:#f5f8fc; display:flex; justify-content:center; align-items:center; padding:28px; }
      .box2 img { max-width:420px; width:100%; border-radius:14px; box-shadow:0 2px 12px rgba(239,118,76,0.10); }

      /* Flash messages */
      .flash-danger { color:var(--accent); font-weight:700; margin-bottom:8px; }
      .flash-success { color:var(--primary); font-weight:700; margin-bottom:8px; }

      /* Responsive tweaks */
      @media(max-width:880px) {
        .container { flex-direction:column; border-radius:16px; }
        .box1, .box2 { padding:28px; }
        .box2 img { max-width:320px; }
        input[type=submit] { align-self:stretch; text-align:center; }
      }
      @media(max-width:420px) {
        .box1 h1 { font-size:1.25rem; }
        .brand .logo { width:48px; height:48px; font-size:18px; }
        .box2 img { max-width:220px; }
      }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">
            <div class="brand-row">
                <div class="brand">
                    <div class="logo">PC</div>
                </div>
                <div>
                    <div class="title">PetClinic</div>
                    <div class="subtitle">Administrator</div>
                </div>
            </div>

            <h1>Admin Login</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  {% if category == 'danger' %}
                    <div class="flash-danger">{{ message }}</div>
                  {% else %}
                    <div class="flash-success">{{ message }}</div>
                  {% endif %}
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('admin_login') }}">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" required>

                <label for="password">Password</label>
                <input id="password" type="password" name="password" required>

                <input type="submit" id="submit" value="Login">
            </form>

            <p class="link">← Back to <a href="{{ url_for('home') }}">Home</a></p>
        </div>

        <div class="box2">
            <img src="{{ url_for('static', filename='admin_login.png') }}" alt="Admin Illustration">
        </div>
    </div>
</body>
</html>
